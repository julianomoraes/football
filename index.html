<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Youth Football League Schedule</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>🏈 Youth Football League</h1>
    <p>Game Schedule</p>
  </header>

  <main>
    <div class="controls">
      <select id="club-filter">
        <option value="">All Clubs</option>
      </select>
      <select id="team-filter">
        <option value="">Select a team…</option>
      </select>
      <input id="search-input" type="text" placeholder="Search team, opponent, or venue…" />
    </div>

    <p id="status" class="status info" hidden></p>

    <h2 id="team-heading">Select a team above to see its schedule, or search all games.</h2>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Week</th>
            <th>Day</th>
            <th>Time</th>
            <th>Home/Away</th>
            <th>Opponent</th>
            <th>Location</th>
          </tr>
        </thead>
        <tbody id="schedule-body"></tbody>
      </table>
    </div>
  </main>

  <footer>
    <p>Schedule data synced from Google Sheets.</p>
    <p class="credit">
      <svg class="credit-logo" viewBox="0 0 48 48" role="img" aria-label="Coyote Creek logo">
        <circle cx="24" cy="24" r="23" fill="var(--green-dark)" />
        <path d="M14 30 L18 15 L22 22 L24 14 L26 22 L30 15 L34 30
                 Q29 26 24 26 Q19 26 14 30 Z" fill="#f4c542" />
        <circle cx="20" cy="21" r="1.4" fill="var(--green-dark)" />
        <circle cx="28" cy="21" r="1.4" fill="var(--green-dark)" />
      </svg>
      Courtesy from NM18 · Coyote Creek
    </p>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
