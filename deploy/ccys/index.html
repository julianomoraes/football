<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Youth Football League Schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Lato:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>window.APP_BASE_PATH = "/schedulev2";</script>
</head>
<body>
  <header>
    <div class="topbar">
      <a class="brand" href="https://ccys.com/">
        <img src="https://ccys.com/wp-content/uploads/2023/05/ccys-new-logo.png" alt="Coyote Creek Youth Sports" />
      </a>
      <a class="join-btn" href="https://ccys.com/contact-us/">Join Us</a>
    </div>
    <div class="hero">
      <h1>Schedule</h1>
      <p class="breadcrumb"><a href="https://ccys.com/">Home</a> / Schedule</p>
    </div>
  </header>

  <p class="season-band">2026 Fall Season</p>

  <main>
    <div class="controls">
      <select id="club-filter">
        <option value="">All Clubs</option>
      </select>
      <select id="team-filter">
        <option value="">Select a team…</option>
      </select>
    </div>

    <p id="status" class="status info" hidden></p>

    <h2 id="team-heading">Select a team above to see its schedule.</h2>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Time</th>
            <th>Home/Away</th>
            <th>Opponent</th>
            <th>Location</th>
          </tr>
        </thead>
        <tbody id="schedule-body"></tbody>
      </table>
    </div>
  </main>

  <footer>
    <p class="credit">Courtesy of NM18 · Coyote Creek</p>
  </footer>

  <script src="config.js?v=13"></script>
  <script src="app.js?v=13"></script>
</body>
</html>
